
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Santa 🎅</title>

    <link rel="stylesheet" href="secretsanta.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="secret.js" defer></script>
</head>
<body>

    <div class="snow"></div>

    <header>
        <div class="logo">🎅 Secret Santa</div>
        <div class="header-label">Christmas Edition</div>
    </header>

    <main>
        <section class="hero">
            <div class="decoration">🎄</div>

            <p class="eyebrow">THE MAGIC OF GIVING</p>

            <h1>Тайный Санта</h1>

            <p class="description">
                Немного волшебства, много подарков
                и один секретный получатель.
            </p>

            <div class="auth-card">

                <div class="tabs">
                    <button class="tab active" id="joinTab">
                        Войти в комнату
                    </button>
                    <button class="tab" id="createTab">
                        Организатор
                    </button>
                </div>

                <div id="joinForm">
                    <h2>Присоединиться</h2>

                    <label for="roomCode">Код комнаты</label>
                    <input id="roomCode" type="text"
                        placeholder="Например, 123456">

                    <label for="participantName">Твоё имя</label>
                    <input id="participantName" type="text"
                        placeholder="Выбери своё имя">

                    <label for="inviteCode">Личный секретный код</label>
                    <input id="inviteCode" type="text"
                        placeholder="Введи свой код">

                    <button class="main-button" id="joinButton">
                        Войти в комнату
                    </button>
                </div>

                <div id="createForm" class="hidden">
                    <h2>Создать комнату</h2>

                    <label for="hostName">Твоё имя</label>
                    <input id="hostName" type="text"
                        placeholder="Имя организатора">

                    <label for="setupCode">Секрет организатора</label>
                    <input id="setupCode" type="password"
                        placeholder="Главный секретный код">

                    <label for="budget">Бюджет подарка</label>
                    <input id="budget" type="text"
                        placeholder="Например, 5000 ₸">

                    <label for="eventDate">Дата обмена подарками</label>
                    <input id="eventDate" type="date">

                    <button class="main-button" id="createButton">
                        Создать комнату
                    </button>
                </div>

                <p id="message"></p>

            </div>
        </section>
    </main>

    <footer>
        Made with ❤️ for Christmas
    </footer>

</body>
</html>
